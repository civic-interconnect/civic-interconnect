# ============================================================
# pyproject.toml (Python project configuration)
# ============================================================
# Updated: 2026-10-16
#
# REQ: All Python src/ projects SHOULD include pyproject.toml.
# WHAT: Defines project identity, dependencies, and build configuration.
# WHY: Keeps Python project metadata and package requirements together.
# CUSTOM: Update project identity, dependencies, and package paths.

# ============================================================
# === SECTION: PROJECT IDENTITY ===
# ============================================================

[project]
name = "civic-interconnect" # PyPi Package name
dynamic = ["version"]  # Using setuptools_scm
description = "Civic Interconnect: Civic Exchange Protocol schemas, validators, and tools for Python workflows"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    { name="Civic Interconnect", email="info@civic-interconnect.org" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
keywords = [
  "civic",
  "interconnect",
  "civic-exchange-protocol",
  "cep",
  "government",
  "open-data",
  "provenance",
  "jsonschema",
  "pydantic",
]

# ============================================================
# === SECTION: PROJECT RUNTIME DEPENDENCIES ===
# ============================================================

dependencies = [
    "civic-data-identity-us-il",
    "jsonschema",
    "pandas",
    "PyYAML",
    "referencing",
    "typer",
]

# ============================================================
# === SECTION: DEVELOPMENT AND DOCUMENTATION DEPENDENCIES ===
# ============================================================
# These packages support developing, testing, and documenting the project.
# They are not required to execute the project code.

[dependency-groups]
# WHY: Development and documentation tools support maintaining, validating,
#      and documenting the project without becoming runtime dependencies.

dev = [
    # REQ.DEV.DEPS: Standard tools for Python development and validation.
    "defusedxml",
    "maturin",
    "pytest",     # WHY: Run automated tests.
    "pytest-cov", # WHY: Measure and report test coverage.
    "ruff",       # WHY: Lint and format Python code.
    "ty",         # WHY: Check Python types using static analysis.
]
docs = [
    # REQ.DOCS.DEPS: Standard tools for generating project documentation.
    "mkdocstrings[python]", # WHY: Generate API documentation from Python docstrings.
    "zensical",             # WHY: Build the project documentation website.
]

[project.urls]
"Documentation" = "https://civic-interconnect.github.io/civic-interconnect/"
"Homepage" = "https://github.com/civic-interconnect/civic-interconnect"
"Issues" = "https://github.com/civic-interconnect/civic-interconnect/issues"
"Source" = "https://github.com/civic-interconnect/civic-interconnect"

[project.scripts]
cx = "civic_interconnect.cli.cli:app"

# ============================================================
# === SECTION: TOOL CONFIGURATION ===
# ============================================================

# === TY (PYTHON TYPE CHECKING) ===

[tool.ty.environment]
extra-paths = ["typings"]
# CUSTOM: We have typings/cep_py/__init__.pyi.
# WHY: Ty is not finding that stub when resolving the compiled Rust extension.

# === UV (PYTHON ENVIRONMENT AND DEPENDENCY MANAGEMENT) ===

[tool.uv]
# WHY: Install all dependency groups with the canonical uv sync.
default-groups = "all"

# WHY: Give a bit of time to find hijacked releases before installing.
# CUSTOM: Should match `uv run prek update --freeze --cooldown-days 7`
exclude-newer = "7 days"

# ============================================================
# === SECTION: BUILD SYSTEM ===
# ============================================================
#
# WHAT: Defines how the project's Python package is built and installed.
# WHY: Hatchling enables uv to install the local src/ package so
#      Python modules and tests can import project code consistently.
# REQ: All importable project code MUST live under src/.
# CUSTOM: Match the package directory under src/ exactly.

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[tool.hatch.build.hooks.vcs]
# WHY: Writes computed version into src/*/_version.py at build time.
# CUSTOM: Must match src/ folders.
version-file = "src/python/src/civic_interconnect/_version.py"

[tool.hatch.build.targets.wheel]
# CUSTOM: Must match src/ folders.
packages = ["src/python/src/civic_interconnect"]

[tool.hatch.version]
# WHY: Version is derived from git tags.
source = "vcs"
tag-pattern = "^(?:v)?(?P<version>\\d+\\.\\d+\\.\\d+)$"

[tool.hatch.version.raw-options]
# WHY: Allow hatch-vcs to find the Git root when built from a subdirectory,
# temporary build directory, or isolated build environment.
search_parent_directories = true
